<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./script.js" defer></script>
</head>
<body>
    <div class="container">
        <div id="output"  class="output">0</div>

        <div id="input" class="inputs">
            <button id="clr" class="btn">C</button>
            <button id="del" class="btn">DEL</button>
            <button id="per" class="btn">%</button>
            <button id="div" class="btn">/</button>
            <button id="sev" class="btn">7</button>
            <button id="eig" class="btn">8</button>
            <button id="nin" class="btn">9</button>
            <button id="mul" class="btn">*</button>
            <button id="fur" class="btn">4</button>
            <button id="fiv" class="btn">5</button>
            <button id="six" class="btn">6</button>
            <button id="mns" class="btn">-</button>
            <button id="one" class="btn">1</button>
            <button id="two" class="btn">2</button>
            <button id="thr" class="btn">3</button>
            <button id="pls" class="btn">+</button>
            <button id="dec" class="btn">.</button>
            <button id="zer" class="btn">0</button>
            <button id="eql" class="btn">=</button>
        </div>
    </div>
</body>
</html>
